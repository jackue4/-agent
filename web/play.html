<!doctype html><html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080e17">
<title>造梦 · 游戏</title><link rel="stylesheet" href="/app.css">
<style>
html,body{height:100%;overflow:hidden;overscroll-behavior:none;background:#080e17}
.pl{position:relative;isolation:isolate;height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center}
.pl::before{content:'';position:absolute;z-index:-2;inset:0;background:linear-gradient(#080e17a3,#080e17dd),url('/visuals/studio-atmosphere.png') center/cover;pointer-events:none}
.pbg{position:absolute;z-index:-1;inset:-40px;background:transparent center/cover;filter:blur(42px) brightness(.2) saturate(.55);opacity:.65}
.pstage{position:relative;width:100%;height:100%;background:#080e17;overflow:hidden;border-radius:0}
.pstage iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.loading{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;gap:14px;background:radial-gradient(ellipse at center,#18314866,transparent 70%),#080e17;color:#91abc0;font-size:12px;letter-spacing:.6px}
.loading img{width:88px;height:88px;object-fit:contain;filter:drop-shadow(0 10px 22px #56bddb1f)}
.spin{width:22px;height:22px;border-radius:50%;border:1.5px solid #b4d6ee1c;border-top-color:#7bdfff;animation:sp .9s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.ptop{position:absolute;z-index:3;left:0;right:0;top:0;display:flex;align-items:center;pointer-events:none}
.ib{min-height:40px;padding:10px 14px;border-radius:30px;display:inline-flex;align-items:center;gap:5px;color:#f7f7fa;background:#101014e6;border:1px solid #fff3;font-size:11px;backdrop-filter:blur(16px);pointer-events:auto}
.ib:hover{background:#7bdfff22;border-color:#7bdfff55}.ib .ui-icon{width:18px;height:18px}
body.embedded .ptop{display:none!important}
html:has(body.embedded){height:100%;overflow:hidden}
body.embedded{height:100%;overflow:hidden}
body.embedded .pl{max-width:none;width:100%;height:100%;min-height:100%}
body.embedded .pstage{border-radius:0;box-shadow:none}
.pl,body.embedded .pl{position:fixed;left:50%;top:50%;width:var(--play-width,100vw);height:var(--play-height,100dvh);min-height:0;max-width:none;margin:0;transform:translate(-50%,-50%) rotate(var(--play-rotation,0deg));background:#101014;overflow:hidden}
.ptop{pointer-events:none}.ptop .ib{pointer-events:auto}
.ptop .back{margin-right:auto}
.pl[data-rotation="90"]{--safe-top:env(safe-area-inset-left);--safe-left:env(safe-area-inset-bottom);--safe-right:env(safe-area-inset-top);--safe-bottom:env(safe-area-inset-right)}
.pl[data-rotation="-90"]{--safe-top:env(safe-area-inset-right);--safe-left:env(safe-area-inset-top);--safe-right:env(safe-area-inset-bottom);--safe-bottom:env(safe-area-inset-left)}
.ptop{padding-top:calc(var(--safe-top,env(safe-area-inset-top)) + 10px);padding-left:max(12px,var(--safe-left,env(safe-area-inset-left)));padding-right:max(12px,var(--safe-right,env(safe-area-inset-right)))}
@media(prefers-reduced-motion:reduce){.spin{animation-duration:2s}}
</style></head><body>
<div class="pl">
  <div class="pbg" id="pbg"></div>
  <div class="ptop"><a class="ib back" href="/" aria-label="退出返回主页"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m14 6-6 6 6 6"/></svg><span>退出返回</span></a></div>
  <div class="pstage" id="stage"><iframe id="rt" title="游戏画面" src="/game/index.html" allow="autoplay; fullscreen" allowfullscreen></iframe><div class="loading" id="ld"><img src="/visuals/ai-robot.png" alt="" width="88" height="88"><div class="spin"></div><div>正在打开游戏…</div></div></div>
</div>
<script type="module">
import { $, api, Runtime } from '/common.js';
import { rememberPlayed } from '/platform-ui.js';
import { gameOrientation, applyGameViewport } from '/game-viewport.js';
const id = new URLSearchParams(location.search).get('id');
const embedded = new URLSearchParams(location.search).get('embed') === '1';
if (embedded) document.body.classList.add('embedded');
let g = null, counted = false;
const rt = new Runtime($('#rt'), ev => { if (ev.type === 'ready') { $('#ld').hidden = true; if (g && !g.pck) start(); } });
// Godot-project games: the shared engine runs the published pack; restarting reloads the page.
function start(card = true) {
  if (g.pck) rt.reload('/gp.html?pck=' + encodeURIComponent(g.pck) + '&t=' + Date.now());
  else rt.send({ type: 'load', spec: g.spec, assets: g.assets, mode: 'play', start_card: card });
  setTimeout(() => rt.focus(), 200);
  if (!counted) { counted = true; api('/games/' + id + '/play', { body: {} }); }
}
function fit() {
  applyGameViewport($('.pl'), gameOrientation(g || {}), { embedded });
}
addEventListener('resize', fit);
addEventListener('fullscreenchange', fit);
addEventListener('webkitfullscreenchange', fit);
screen.orientation?.addEventListener?.('change', fit);
window.visualViewport?.addEventListener('resize', fit);
fit();
(async () => {
  try { g = await api('/games/' + id); }
  catch (err) {
    const project = await api('/projects/' + id).catch(() => null);
    const meta = project?.game?.meta;
    if (!project?.pck || !meta) throw err;
    g = { id, title: meta.title, pitch: meta.pitch || '', author: '造梦玩家', plays: 0, likes: 0, cover: '', orientation: meta.orientation || 'landscape', dimension: meta.dimension, spec: project.game, pck: project.pck };
  }
  rememberPlayed({ ...g, id });
  document.title = g.title + ' · 造梦';
  if (g.cover) $('#pbg').style.backgroundImage = 'url(' + g.cover + ')';
  fit();
  if (embedded) parent.postMessage({ type: 'dream-play-orientation', orientation: gameOrientation(g) }, location.origin);
  if (g.pck || rt.ready) start();
})();
addEventListener('pagehide', () => { if (!embedded) { try { screen.orientation?.unlock?.(); } catch {} } });
</script></body></html>
