<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content"><meta name="theme-color" content="#101014"><title>造梦 · 好玩，由你创造</title><link rel="stylesheet" href="/app.css"><link rel="stylesheet" href="/social.css"><link rel="stylesheet" href="/home.css"><link rel="stylesheet" href="/create-flow.css"></head>
<body class="home"><div class="platform-shell">
<header class="platform-header"><a class="dream-brand" href="#feed"><span class="brand-mark">造</span><span>造梦<small>PLAY YOUR IMAGINATION</small></span></a><div class="header-actions"><button class="round-button" id="searchToggle" aria-label="搜索游戏"><span data-icon="search"></span></button><button class="profile-shortcut" data-goto="me" aria-label="打开我的主页"><span class="avatar-head" data-my-avatar></span></button></div></header>
<main><section class="platform-view" id="feedView" aria-label="首页"><label class="global-search" id="searchBox" hidden><span data-icon="search"></span><input id="gameSearch" type="search" placeholder="搜索游戏、玩法或创作者" aria-label="搜索游戏"></label><div id="featured" class="featured"><div class="loading-state">正在发现好玩的世界…</div></div><div class="category-tabs" id="categoryTabs" aria-label="游戏分类"><button data-category="all" class="on">为你推荐</button><button data-category="adventure">冒险闯关</button><button data-category="puzzle">休闲益智</button><button data-category="card">卡牌策略</button><button data-category="3d">3D 世界</button></div><div id="feed"></div><div class="feed-footer"><span>下一个好玩的游戏，来自你。</span><button class="text-link" data-create>开始创造 <span data-icon="arrow"></span></button></div></section>
<section class="platform-view discover-view" id="discoverView" aria-label="发现游戏" hidden><header class="discover-heading"><h1>发现</h1><span>上滑，遇见下一个好玩</span></header><div id="discoverFeed" class="discover-feed" tabindex="0" aria-label="上下滑动浏览游戏"></div></section>
<section class="platform-view friends-view" id="friendsView" aria-label="好友聊天" hidden><div id="socialRoot"></div></section>
<section class="platform-view me-view" id="meView" aria-label="我的主页" hidden><div class="profile-top"><span class="soft-pill">✦ 我的创作空间</span><button class="round-button" id="editProfile" aria-label="编辑资料"><span data-icon="edit"></span></button></div><div class="profile-info"><button class="profile-portrait" id="changeAvatar" aria-label="切换头像"><span class="avatar-head" data-my-avatar></span></button><h1 id="profileName">造梦玩家</h1><span class="profile-handle">@dreamer · 每个灵感都值得被玩到</span><p id="profileBio"></p><button class="outline-button" id="editProfileMain">编辑资料</button></div><div class="profile-stats" id="stats"></div><div class="works-tabs" id="worksTabs" aria-label="作品分类"><button data-status="all" class="on"><span data-icon="grid"></span>我的创作</button><button data-status="published"><span data-icon="game"></span>已发布</button><button data-status="draft"><span data-icon="edit"></span>草稿</button><button data-status="recent"><span data-icon="clock"></span>最近玩过</button></div><div class="works-toolbar"><span id="worksCount"></span><label class="works-search"><span data-icon="search"></span><input id="mineSearch" type="search" placeholder="搜索游戏" aria-label="搜索我的游戏"></label></div><div class="game-grid mine-grid" id="mine"></div></section></main>
<nav class="tabbar" aria-label="主导航"><button data-tab="feed" class="on"><span data-icon="home"></span><span>首页</span></button><button data-tab="discover"><span data-icon="compass"></span><span>发现</span></button><button class="create-tab" id="createBtn" aria-label="创造游戏"><span class="create-orb" data-icon="plus"></span><span>创造</span></button><button data-tab="friends"><span class="nav-icon-wrap"><span data-icon="chat"></span><b id="chatBadge" hidden></b></span><span>好友</span></button><button data-tab="me"><span data-icon="user"></span><span>我的</span></button></nav>
</div><script type="module" src="/home.js"></script></body></html>
